name: Screen Protection Adaptive Core 2.1.5
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Android unit tests and assemble debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT5MM-2.1.5-Adaptive-Core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish 2.1.5 Adaptive Core prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=screen-protection-v2.1.5-adaptive-core-debug
          ASSET=app/build/outputs/apk/debug/app-debug.apk
          # Match the source-code tag to the exact commit that produced this APK.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          NOTES="Adaptive Core 2.1.5 debug. One button; removes foreground app tracking and Usage Access; holds manual brightness until significant confirmed ambient change. Faster light adaptation, low-power sampling, source-to-Settings write latency log. Experimental: raw 17/19/49/52 and the 60% app-level protection cap are NOT verified on Redmi K90. No root/ADB/Shizuku/Magisk or external helper. Source commit: $GITHUB_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "RT5MM Adaptive Core 2.1.5 debug" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --prerelease \
              --title "RT5MM Adaptive Core 2.1.5 debug" --notes "$NOTES"
          fi
